name: Purchaser
description: >-
  Purchaser is an AI-powered RFQ (Request for Quotation) intelligence platform for
  capital-intensive industries such as EPC, LNG, transmission & distribution, and
  specialty-equipment manufacturing. It ingests unstructured vendor quotes from PDFs,
  emails, and spreadsheets and normalizes them into structured, defensible sourcing
  data so procurement teams can level bids apples-to-apples, surface deviations and
  gaps, and produce audit-ready award traceability. Purchaser exposes a REST API
  (OpenAPI 3.1) covering the full sourcing lifecycle — RFQs, vendors, conversations,
  quotes, files, and webhooks — with API-key auth, idempotency keys, versioned
  /api/v1/ endpoints, sliding-window rate limiting, and connectors for SAP S/4HANA,
  Oracle ERP Cloud, Microsoft Dynamics 365, Infor, and more. Based in Lexington, KY
  and backed by Homebrew.
